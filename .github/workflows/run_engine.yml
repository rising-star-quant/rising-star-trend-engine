name: Rising Star Engine Daily Run

on:
  schedule:
    # רצה אוטומטית בכל יום בימים שני-שישי בשעה 22:00 UTC (לאחר נעילת מסחר בארה"ב)
    - cron: '0 22 * * 1-5'
  workflow_dispatch: # מאפשר גם ללחוץ ידנית כפתור "הרץ עכשיו" מתי שתרצה

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance pandas requests lxml

      - name: Run Trend Engine Script
        env:
          PYTHONUNBUFFERED: "1"  # <-- זה השורה שגורמת ללוגים להופיע מיד!
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python engine.py
